<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition in css</title>
    <style>
        div{
            width:20px;
            padding: 3px;
            color: black;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 2s linear;
        }
        div:hover{
            transform: rotateZ(90deg);

            color:rgba(94, 128, 0, 0.532);
        }
    </style>
</head>
<body>
    <div>&gt</div>
</body>
</html>
