<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing</title>
    <style>
        .container{
            height: 50px;
            width: 50px;
            border: 2px solid red;
            position: absolute;
            top: 0;
            padding: 20px;
        }
        .box{
            width: 100px;
            height: 50px;
            border: 2px solid green;
            position: absolute;
            top: 0px;
            left: 0px;
            transition: transform 2s linear;
        }
        .box:hover{
            transform: rotate(360deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
