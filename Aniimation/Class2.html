<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation in css</title>
    <style>
        .container{
            border: 2px solid red;
            width: 150px;
            height: 150px;
            background-color: red;
            animation-name: colorChange;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: absolute;
        }
        @keyframes colorChange {
            0%{
                top:0;
                left:0;
            }
            25%{
                top: 0;
                left: 200px;
            }
            50%{
                top: 100px;
                left: 200px;
            }
            75%{
                top: 100px;
                left:0px;
            }
            100%{
                top: 0px;
                left: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        Modhan DAS
    </div>
</body>
</html>
