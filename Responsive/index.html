<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
        }
        .Container{
            width: 50%;
            height: 50%;
            border: 2px solid red;
        }
        .Container .box1{
            border: 2px solid black;
            width: 30%;
            height: 40%;
        }
    </style>
</head>
<body>
    <div class="Container">
        <div class="box1"></div>
    </div>
</body>
</html>
