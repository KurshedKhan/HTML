<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em and rem in html</title>
    <style>
        .container{
            max-width: 100%;
            max-height: 100%;
            border: 2px solid blue;
            font-size: 17px;
            padding: 10px;
            box-sizing: border-box;
        }
        h1{
            font-size: 2.5em;
        }
        button{
            font-size: 1.1em;
        }
        p{
            font-size: 0.8em;
            text-align: justify;
        }
        @media screen and (min-width:900px) {
            .container{
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Maiores deserunt eum quidem itaque iste. Mollitia reiciendis reprehenderit consectetur omnis quam, harum ad libero dolorem! Fuga excepturi dolorem nihil mollitia vero!</p>
        
        <button>Submit</button>
    </div>
</body>
</html>
