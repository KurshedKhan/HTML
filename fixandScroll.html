<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix and Scroll in html</title>
    <style>
        .container{
            border: 2px solid red;
            height: 2000px;
        }
        .mini-container{
            border: 2px solid green;
            height: 540px;
            display: flex;
        }
        .box1{
            border: 2px solid darkorange;
            width: 100%;
        }
        .box2{
            border: 2px solid blue;
            width: 100%;
            padding: 10px;
            overflow: hidden;
            overflow-y: scroll;
            scrollbar-width:none;
        }
        .box-mini{
            width: 100%;
            border: 2px solid black;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mini-container">
            <div class="box1">

            </div>
            <div class="box2">
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
                <div class="box-mini"></div>
            </div>
        </div>
    </div>
</body>
</html>
