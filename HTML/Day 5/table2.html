<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table with colspan and rowspan</title>
</head>
<body>
  <table border="1" style="border-collapse: collapse;">
    <tbody>
      <tr>
        <td colspan="5">Student Data</td>
      </tr>
      <tr>
        <td colspan="2" rowspan="2">5</td>
        <td colspan="3">6</td>
      </tr>
      <tr>
        <td>10</td>
        <td>11</td>
        <td>12</td>
      </tr>
      <tr>
        <td>15</td>
        <td>16</td>
        <td colspan="2" rowspan="2">17</td>
        <td>18</td>
      </tr>
      <tr>
        <td>20</td>
        <td>21</td>
        <td>22</td>

      </tr>
      <tr>
        <td colspan="5">Final Result</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
