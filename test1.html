<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test 1 in html</title>
    <style>
        .container{
            width: 250px;
            height: 350px;
            border-bottom: 10px solid brown;
            border-radius: 10px;
            box-shadow: 1px 1px 6px brown;
        }
        .container h1{
            border: 2px solid brown;
            margin: 0px;
            border-radius: 5px 5px 0px 0px;
            padding: 10px 0px;
            text-align: center;
            background-color: brown;
            color: white;
        }
        .container ul{
            margin: 0;
            padding-left:0px ;
            list-style-position: inside;
        }.container ul li{
            padding: 10px;
        }
        .topBorder{
            border-top:2px solid brown ;
            background-color: rgba(128, 128, 128, 0.619);
            list-style-type:circle;
        }
        .bottomBorder{
            border-bottom:2px solid brown ;
            background-color: rgba(128, 128, 128, 0.619);
            list-style-type:circle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unordered list</h1>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li class="topBorder">JavaScript</li>
            <li class="bottomBorder">PHP</li>
            <li>PYTHON</li>
            <li>SQL</li>
        </ul>
    </div>
</body>
</html>
