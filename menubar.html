<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Bar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container{
            width: 300px;
            height: 200px;
            display: none;
            background-color: black;
            border-radius: 7px;
            
        }
        input#check{
            display: none;
        }
        input#check:checked ~ .container{
            display: block;
        
        }
        .bi-list{
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }
        .bi-xbox{
            position: absolute;
            visibility: hidden;
        }
        input#check:checked ~ label[for="check"] .bi-xbox{
            top: 34%;
            left: 59.5%;
            visibility: visible;
            color: white;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="check">
    <label for="check">
        <i class="bi bi-list"></i>
        <i class="bi bi-xbox"></i>
    </label>
    <div class="container">

    </div>
</body>
</html>
