<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider in CSS</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
        }

        .slider{
            position: relative;
            width: 80%;
            max-width: 600px;
            height: 60%;
            box-shadow: 1px 1px 9px rgba(0, 0, 0, 0.447);
            border-radius: 5px;
            overflow: hidden;
        }
        input[type="radio"]{
            display: none;
        }
        .label-more{
            position: absolute;
            bottom: 10px;
            left: 45%;
        }
        .label-circle{
            width: 13px;
            height: 13px;
            border: 1px solid black;
            border-radius: 50%;
            display: inline-block;
            
        }
        .slides{
            display: flex;
            height: 100%;
            width: 100%;
            transition: transform 0.5s all;
        }
        .slide{
            min-width: 100%;
            box-sizing: border-box;
        }
        .slide-1-img{
            background-image: url("golden-temple-guru-nanak.jpg");
            background-position:center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .slide-2-img{
            background-image: url("taj\ Mahal.jpeg");
            background-position:center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .slide-3-img{
            background-image: url("birla-mandir.jpg");
            background-position:center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .slide-4-img{
            background-image: url("hawa-mahal.webp");
            background-position:center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .slide-5-img{
            background-image: url("albert-hall-museum.jpg");
            background-position:center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        input#slide1:checked ~ .label-more label[for="slide1"]{
            background-color: black;
        }
        input#slide2:checked ~ .label-more label[for="slide2"]{
            background-color: black;
        }
        input#slide3:checked ~ .label-more label[for="slide3"]{
            background-color: black;
        }
        input#slide4:checked ~ .label-more label[for="slide4"]{
            background-color: black;
        }
        input#slide5:checked ~ .label-more label[for="slide5"]{
            background-color: black;
        }
      

        input#slide1:checked ~ .slides{
            transform: translateX(0);
        }
        input#slide2:checked ~ .slides{
            transform: translateX(-100%);
        }
        input#slide3:checked ~ .slides{
            transform: translateX(-200%);
        }
        input#slide4:checked ~ .slides{
            transform: translateX(-300%);
        }
        input#slide5:checked ~ .slides{
            transform: translateX(-400%);
        }
    </style>
</head>
<body>
    <div class="slider">
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        <input type="radio" name="slider" id="slide4">
        <input type="radio" name="slider" id="slide5">

        <div class="slides">
            <div class="slide slide-1-img">
            </div>
            <div class="slide slide-2-img">
            </div>
            <div class="slide slide-3-img">
            </div>
            <div class="slide slide-4-img">
            </div>
            <div class="slide slide-5-img">
            </div>
        </div>

        
        <div class="label-more">
            <label for="slide1" class="label-circle"></label>
            <label for="slide2" class="label-circle"></label>
            <label for="slide3" class="label-circle"></label>
            <label for="slide4" class="label-circle"></label>
            <label for="slide5" class="label-circle"></label>
        </div>
    </div>
</body>
</html>
