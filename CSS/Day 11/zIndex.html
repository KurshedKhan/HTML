<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-index in html</title>
  <style>
    .box1{
      height: 100px;
      width: 100px;
      background-color: red;
      position: absolute;
      top: 0;
      left: 5px;
      z-index: 1;
    }
    .box2{
      height: 100px;
      width: 100px;
      background-color: yellow;
      position: absolute;
      top: 0;
      left: 30px;
      z-index: 0;
    }
    .box3{
      height: 100px;
      width: 100px;
      background-color:green;
      position: absolute;
      top: 0;
      left: 20px;
      z-index:2;
    }
  </style>
</head>
<body>
  <div class="box1"></div>
  <div class="box2"></div>
  <div class="box3"></div>
</body>
</html>
