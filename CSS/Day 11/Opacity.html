<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opacity in CSS</title>
  <style>
    .box{
      border: 2px solid red;
      background-color:rgba(0, 0, 0, 0.3);
      height: 300px;
      width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;

    }
    .box1{
      border: 2px solid red;
      background-color: red;
      height: 300px;
      width: 300px;
      color: white;
      font-size: 30px;
    }
    .box2{
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color:rgba(0, 0, 0, 0.311) ;
    }
  </style>
</head>
<body>
  <div class="box">
    Mohan Das
  </div>
  <div class="box1">
    <div class="box2">
      Mohan Das
    </div>
  </div>
</body>
</html>
