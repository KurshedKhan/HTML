<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduction of box shadow and text shadow</title>
  <style>
    .container{
      height: 200px;
      width: 200px;
      margin: 0 auto;
      margin-top: 30px;
      box-shadow:inset 0px 0px 8px rgba(0, 0, 0, 0.2);
      border-radius: 5px;
      display: flex;
      align-items:center;
      justify-content: center;
      font-size: 10px;
      color: white;
      text-shadow: 0 0 2px #00ff00, 0 0 20px #00ff00;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('background.jpg');
      background-size: cover;
    }
    button{
      border: none;
      outline: none;
      padding: 10px 20px;
      border-radius: 4px;
      background:linear-gradient(90deg,red,yellow);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tech Innovation</h1>
  </div>
  <button>Submit</button>
</body>
</html>
