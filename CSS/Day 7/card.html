<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Card Desing in html and css</title>
  <style>
    *{
      margin: 0;
    }
    body{
      background-color: rgb(206, 202, 202);
    }
    .card{
      width: 300px;
      margin: 0 auto;
      background-color: white;
      margin-top: 20px;
      border-radius: 5px;
    }
    .card img{
      width: 100%;
      border-radius: 5px ;
    }
    .card .textBox{
      padding: 10px;
    }
    .card .textBox h2{
      text-align: center;
      padding: 5px 0px;
    }
    .card .textBox p{
      text-align: justify;
    }
    .card .textBox button{
      padding: 10px 10px;
      margin:8px 0px ;
      border: none;
      border-radius: 4px;
      background-color: yellow;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="OIP.jpeg" alt="phone images">
    <div class="textBox">
      <h2>iphone 13</h2>
      <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Cupiditate culpa voluptatem ducimus odio vitae, alias quis fuga, quia adipisci aliquam veniam vel.</p>
      <button>Buy Now</button>
    </div>
  </div>
</body>
</html>
