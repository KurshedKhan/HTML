<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position absolute</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

  
      .container1{
        height: 500px;
        width: 500px;
        background-color: red;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .container2{
        height: 400px;
        width: 400px;
        background-color: pink;
        display: flex;
        align-items: center;
        justify-content: center;
       
      }
      .container {
        height: 300px;
        width: 300px;
        background-color: green;
        overflow: hidden;
      }
      .box {
        height: 150px;
        width: 150px;
        background-color: yellow;
        position: absolute;
        top: 20px;
        left: 20px;
      }
    </style>
  </head>
  <body>

    <div class="container1">
      <div class="container2">
        <div class="container">
          <div class="box"></div>
        </div>
      </div>
    </div>

  </body>
</html>
