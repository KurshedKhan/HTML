<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position relative</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box{
      height: 200px;
      width: 200px;
      background-color: green;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      top: -50px;
    }
  </style>
</head>
<body>
  <div class="box">
    Box1
  </div>
</body>
</html>
