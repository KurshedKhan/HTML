<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Queries in html and css</title>
  <style>
    *{
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }
    header{
      height: 80px;
      border: 2px solid red;
      background-color: red;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media screen and (max-width:400px) {
      header{
        color: black;
        background-color: white;
        font-size: 10px;
        height: fit-content;
        padding: 10px;
      }
    }


    @media screen and (min-width:401px) and (max-width:700px) {
      header{
        color: black;
        background-color: green;
        font-size: 10px;
        height: fit-content;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
  </header>
</body>
</html>
