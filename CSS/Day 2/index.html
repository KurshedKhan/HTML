<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Properties and Box Model</title>
  <style>
    *{
      margin: 0;
    }
    .box-model{
      /* 
      border-width: 10px;
      border-style:outset;
      border-color:pink;
      */
      /* Short-Hand Property */
      border: 10px outset pink;
    }
    h1{
      border: 2px solid red;
      width: fit-content;
      margin:10px;
    }
    p{
      border: 2px solid red;
      margin: 10px;
      padding: 30px;
    }
  </style>
</head>
<body>
  <div class="box-model">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae explicabo veritatis, quidem magni excepturi fuga ex optio ipsam neque ab.
  </div>
  <h1>Hello World</h1>
  <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Impedit, culpa?</p>
  <span>Lorem, ipsum.</span>
</body>
</html>
