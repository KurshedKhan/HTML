<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transform in html and css</title>
  <style>
    .box{
      border: 2px solid red;
      height: 100px;
      width: 100px;
      border-radius:5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 30px;
    }
    .box:hover{
      transform: skew(20deg,20deg);
    }
  </style>
</head>
<body>
  <div class="box">
    Box 1
  </div>
</body>
</html>
