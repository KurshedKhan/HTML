<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Box in css</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      border: 2px solid red;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
    }
    .box{
      height: 200px;
      margin: 10px;
      flex-grow: 1;
    }
    
    .box>img{
      width: 100%;
      height: 100%;
    }
    .box:nth-child(1){
      flex-grow: 15;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <img src="K:\Web Development 2025\CSS\Day 9\Project1\Images\images1.webp" alt="Images 1">
    </div>
    <div class="box">
      <img src="K:\Web Development 2025\CSS\Day 9\Project1\Images\images2.webp" alt="Images2">
    </div>
    <div class="box">
      <img src="K:\Web Development 2025\CSS\Day 9\Project1\Images\images3.webp" alt="Images3">
    </div>
    <div class="box">
      <img src="K:\Web Development 2025\CSS\Day 9\Project1\Images\images4.webp" alt="Images4">
    </div>
  </div>
</body>
</html>
