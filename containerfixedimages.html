<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container fixed images</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        .container{
            border: 2px solid red;
            width: 900px;
            height:350px;
            overflow: hidden;
        }
        .container img{
            height: 350px;
            width: 898px;
    
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="flamingo-fallback.jpg" alt="">
    </div>
</body>
</html>
